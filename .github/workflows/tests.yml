name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: edtech_test
          MYSQL_USER: improvia_test
          MYSQL_PASSWORD: test_user_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: edtech_test
      DB_USER: improvia_test
      DB_PASSWORD: test_user_password
      DATABASE_URL: ""
      MYSQL_TEST_ADMIN_URL: "mysql+pymysql://improvia_migration_admin:test_admin_password@127.0.0.1:3306/mysql"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest<9" requests beautifulsoup4

      - name: Configure isolated migration-test administrator
        shell: bash
        run: |
          container_id="$(docker ps --filter 'ancestor=mysql:8.0' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" mysql --protocol=socket -uroot -ptest_root_password -e "
            CREATE USER IF NOT EXISTS 'improvia_migration_admin'@'%' IDENTIFIED BY 'test_admin_password';
            GRANT ALL PRIVILEGES ON *.* TO 'improvia_migration_admin'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=test_exam_platform.py
