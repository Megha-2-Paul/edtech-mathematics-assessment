name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: edtech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: edtech_test
      DB_USER: root
      DB_PASSWORD: test_root_password
      DATABASE_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest<9" requests beautifulsoup4

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=test_exam_platform.py
