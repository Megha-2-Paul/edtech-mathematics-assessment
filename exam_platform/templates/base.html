<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mathematics Assessment{% endblock %}</title>
    <script src="{{ url_for('static', filename='math_render.js') }}"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f5f5f5; color:#333; line-height:1.6; }
        .container { max-width:1200px; margin:0 auto; padding:20px; }
        header { background:white; box-shadow:0 2px 4px rgba(0,0,0,.1); margin-bottom:20px; }
        .header-content { padding:20px 0; display:flex; justify-content:space-between; align-items:center; }
        h1 { font-size:24px; font-weight:600; }
        .card { background:white; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.1); padding:24px; margin-bottom:20px; }
        button,.btn { background:#2563eb; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-size:14px; font-weight:500; transition:.2s; text-decoration:none; display:inline-block; }
        button:hover,.btn:hover { background:#1d4ed8; }
        button:disabled { background:#9ca3af; cursor:not-allowed; }
        .btn-secondary { background:#6b7280; }
        .btn-secondary:hover { background:#4b5563; }
        .btn-danger { background:#dc2626; }
        .btn-danger:hover { background:#b91c1c; }
        {% block custom_styles %}{% endblock %}
    </style>
</head>
<body>
<header><div class="container"><div class="header-content"><h1>Mathematics Assessment</h1></div></div></header>
<main><div class="container">{% block content %}{% endblock %}</div></main>
</body>
</html>
