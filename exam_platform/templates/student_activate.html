<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activate student account | Improvia</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #182230; padding: 20px; box-sizing: border-box; }
    main { width: 100%; max-width: 440px; background: white; padding: 28px; border: 1px solid #e2e8f0; border-radius: 16px; box-sizing: border-box; box-shadow: 0 8px 28px rgba(16,24,40,.06); }
    h1 { margin: 0 0 8px; font-size: 1.6rem; } p { color: #526071; line-height: 1.5; }
    label { display: block; font-weight: 650; margin: 18px 0 6px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 9px; padding: 12px; font: inherit; }
    button { width: 100%; border: 0; border-radius: 9px; padding: 13px; margin-top: 22px; background: #174ea6; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .error { background: #fff0f0; border: 1px solid #ffc7c7; color: #8b1e1e; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Activate your account</h1>
    <p>Create a password to securely access your Improvia assessments. This one-time link expires after 24 hours.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% if token %}
    <form method="post" action="{{ url_for('student_activate') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="password">Create password</label>
      <input id="password" name="password" type="password" minlength="12" required autocomplete="new-password">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" minlength="12" required autocomplete="new-password">
      <button type="submit">Activate account</button>
    </form>
    {% else %}
    <p>Ask Improvia for a new activation link.</p>
    {% endif %}
  </main>
</body>
</html>
