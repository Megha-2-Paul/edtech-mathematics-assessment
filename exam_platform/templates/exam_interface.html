{% extends "base.html" %}
{% block title %}Exam - {{ test.title }}{% endblock %}
{% block custom_styles %}<style>
.exam-container{display:grid;grid-template-columns:190px 1fr;gap:20px;min-height:calc(100vh - 140px)}.question-navigator{background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:16px;position:sticky;top:20px;height:fit-content;max-height:calc(100vh - 160px);overflow-y:auto}.nav-title{font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;margin-bottom:12px}.question-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.question-btn{padding:8px;border:1px solid #d1d5db;background:white;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600}.question-btn:hover{border-color:#2563eb}.question-btn.active{background:#2563eb;color:white;border-color:#2563eb}.question-btn.answered{border-color:#10b981;color:#047857}.question-btn.answered.active{background:#10b981;color:white}.exam-content{background:white;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:28px;overflow-y:auto}.header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:white;border-bottom:1px solid #e5e7eb;margin-bottom:20px}.timer{font-size:18px;font-weight:700;color:#2563eb}.timer.warning{color:#f59e0b}.timer.critical{color:#dc2626}.question-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.question-number{font-size:20px;font-weight:700}.question-marks{background:#f3f4f6;padding:5px 9px;border-radius:5px;font-size:13px}.question-type{font-size:12px;color:#64748b;margin-left:8px}.question-content{margin-bottom:24px;line-height:1.8}.question-content img{max-width:100%;height:auto;margin:12px 0}.answer-choices{margin:18px 0}.answer-choice{display:flex;align-items:flex-start;padding:13px;margin:9px 0;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}.answer-choice:hover{background:#f9fafb;border-color:#2563eb}.answer-choice input{margin:4px 12px 0 0}.answer-choice.selected{background:#eff6ff;border-color:#2563eb}.upload-box{border:2px dashed #cbd5e1;border-radius:8px;padding:20px;text-align:center;margin:16px 0;background:#fafafa}.upload-box.required{border-color:#f59e0b;background:#fffbeb}.upload-box.optional{border-color:#94a3b8}.upload-box:hover{border-color:#2563eb;background:#f0f9ff}.upload-box p{margin:5px 0}.upload-status{font-size:13px;margin-top:8px}.required-label{color:#b45309;font-weight:700}.optional-label{color:#64748b;font-weight:600}.uploaded-images{margin-top:12px}.image-tile{display:inline-block;position:relative;margin:7px;width:120px;height:160px;border:1px solid #d1d5db;border-radius:5px;overflow:hidden;background:white}.image-tile img{width:100%;height:100%;object-fit:cover}.image-remove{position:absolute;top:4px;right:4px;background:#dc2626;color:white;border:0;width:24px;height:24px;border-radius:50%;cursor:pointer}.navigation-buttons{display:flex;gap:12px;margin-top:28px}.navigation-buttons button{flex:1}.submit-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}.submit-modal.open{display:flex}.modal-card{background:white;border-radius:8px;padding:24px;max-width:520px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media(max-width:800px){.exam-container{grid-template-columns:1fr}.question-navigator{position:static;max-height:none}.exam-content{padding:18px}.question-buttons{grid-template-columns:repeat(6,1fr)}}
</style>{% endblock %}
{% block content %}
<div class="header-bar"><h2>{{ test.title }}</h2><div class="timer" id="timer">Loading…</div></div>
<div class="exam-container"><aside class="question-navigator"><div class="nav-title">Questions</div><div class="question-buttons" id="questionNavigator"></div><div style="margin-top:18px;padding-top:16px;border-top:1px solid #e5e7eb"><button onclick="confirmSubmit()" class="btn" style="width:100%;background:#059669">Submit Test</button></div></aside><section class="exam-content" id="questionContent"><div style="text-align:center;padding:40px">Loading…</div></section></div>
<div id="submitModal" class="submit-modal"><div class="modal-card"><h3>Confirm Submission</h3><div id="submitPreview" style="margin-top:16px;color:#555">Loading…</div><div style="display:flex;gap:12px;margin-top:20px"><button onclick="closeSubmitModal()" class="btn btn-secondary" style="flex:1">Cancel</button><button onclick="submitTest()" class="btn" style="flex:1;background:#059669">Submit Test</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
const attemptId='{{attempt.attempt_id}}';let currentQuestion=0,questions=[],timeRemaining={{remaining_seconds}};
async function init(){try{const r=await fetch(`/api/attempt/${attemptId}/questions`);const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to load questions');questions=data.questions;timeRemaining=data.remaining_seconds;renderNavigator();showQuestion(0);updateTimerDisplay();startTimer()}catch(e){document.getElementById('questionContent').innerHTML=`<p style="color:#b91c1c">${escapeHtml(e.message)}</p>`}}
function renderNavigator(){const nav=document.getElementById('questionNavigator');nav.innerHTML='';questions.forEach((q,i)=>{const b=document.createElement('button');b.className='question-btn';b.textContent=i+1;if(i===currentQuestion)b.classList.add('active');if(q.answer_status==='answered')b.classList.add('answered');b.onclick=()=>showQuestion(i);nav.appendChild(b)})}
function showQuestion(i){currentQuestion=i;const q=questions[i];if(!q)return;const typeLabel={'mcq':'MCQ','vsaq':'VSAQ','saq':'SAQ','laq':'LAQ'}[q.question_type]||q.question_type.toUpperCase();let html=`<div class="question-container"><div class="question-header"><div class="question-number">Question ${i+1}<span class="question-type">${typeLabel}</span></div><div class="question-marks">${q.marks} mark${q.marks!==1?'s':''}</div></div><div class="question-content">${q.question_content.map(renderContent).join('')}</div>`;if(q.question_type==='mcq')html+=renderMCQ(q);else html+=renderSubjective(q);html+=`<div class="navigation-buttons"><button onclick="previousQuestion()" ${i===0?'disabled':''}>← Previous</button><button onclick="nextQuestion()" ${i===questions.length-1?'disabled':''}>Next →</button></div></div>`;document.getElementById('questionContent').innerHTML=html;renderNavigator();if(q.handwritten_upload_mode!=='none')loadImages(q.question_id);typesetMath()}
function renderContent(c){if(c.type==='image')return `<img src="${escapeHtml(c.value||'')}" alt="Question image">`;return `<div>${escapeHtml(c.value||'')}</div>`}
function renderMCQ(q){return `<div class="answer-choices">${choices(q)}</div>`}
function renderSubjective(q){let mode=q.handwritten_upload_mode,label=mode==='required'?'<span class="required-label">Required</span>':'<span class="optional-label">Optional</span>';let html=`<h4 style="margin-top:22px">Select Final Answer</h4><div class="answer-choices">${choices(q)}</div>`;if(mode==='none')return html;html+=`<div class="upload-box ${mode}"><strong>Upload Handwritten Solution — ${label}</strong>${mode==='required'?'<p class="upload-status">At least one page must be uploaded before submission.</p>':'<p class="upload-status">Upload your working if you want it reviewed.</p>'}<input type="file" id="fileInput_${q.question_id}" hidden accept="image/jpeg,image/png" onchange="handleFileSelect(event,'${q.question_id}')"><button type="button" class="btn" style="margin-top:10px" onclick="document.getElementById('fileInput_${q.question_id}').click()">Choose Image</button><p style="color:#888;font-size:12px">JPG/JPEG/PNG • maximum 10 MB per image</p><div class="uploaded-images" id="images_${q.question_id}"></div></div>`;return html}
function choices(q){return q.answer_choices.map((choice,i)=>{let letter=String.fromCharCode(65+i),selected=q.selected_answer===letter;return `<label class="answer-choice ${selected?'selected':''}"><input type="radio" name="answer_${q.question_id}" value="${letter}" ${selected?'checked':''} onchange="saveAnswer('${q.question_id}','${letter}')"><span>${escapeHtml(choice)}</span></label>`}).join('')}
async function saveAnswer(id,a){const q=questions.find(x=>x.question_id===id);q.selected_answer=a;q.answer_status='answered';renderNavigator();try{const r=await fetch(`/api/attempt/${attemptId}/response`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question_id:id,selected_answer:a})});if(!r.ok)alert((await r.json()).error||'Could not save answer')}catch(e){alert('Could not save answer')}}
async function handleFileSelect(e,id){const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024){alert('Image is larger than 10 MB.');e.target.value='';return}const fd=new FormData();fd.append('file',file);fd.append('question_id',id);try{const r=await fetch(`/api/attempt/${attemptId}/upload`,{method:'POST',body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Upload failed');await loadImages(id)}catch(err){alert(err.message)}finally{e.target.value=''}}
async function loadImages(id){try{const r=await fetch(`/api/attempt/${attemptId}/images/${id}`);const imgs=await r.json();const c=document.getElementById(`images_${id}`);if(c)c.innerHTML=imgs.map(x=>`<div class="image-tile"><img src="${x.url}" alt="Page ${x.page_number}"><button class="image-remove" onclick="deleteImage('${x.image_id}','${id}')" title="Delete">×</button></div>`).join('')}catch(e){}}
async function deleteImage(img,id){if(!confirm('Delete this image?'))return;await fetch(`/api/attempt/${attemptId}/delete-image/${img}`,{method:'DELETE'});loadImages(id)}
function previousQuestion(){if(currentQuestion>0)showQuestion(currentQuestion-1)}function nextQuestion(){if(currentQuestion<questions.length-1)showQuestion(currentQuestion+1)}
function startTimer(){setInterval(()=>{if(timeRemaining>0)timeRemaining--;updateTimerDisplay();if(timeRemaining<=0)submitTest(true)},1000)}function updateTimerDisplay(){let h=Math.floor(timeRemaining/3600),m=Math.floor(timeRemaining%3600/60),s=timeRemaining%60,t=document.getElementById('timer');t.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;t.classList.toggle('warning',timeRemaining<=300);t.classList.toggle('critical',timeRemaining<=60)}
async function confirmSubmit(){try{const r=await fetch(`/api/attempt/${attemptId}/submit-preview`),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to prepare submission');let missing=d.required_uploads_missing||[];document.getElementById('submitPreview').innerHTML=`<p><strong>Total questions:</strong> ${d.total_questions}</p><p><strong>Answered:</strong> ${d.answered}</p><p><strong>Unanswered:</strong> ${d.unanswered}</p>${missing.length?`<p style="color:#b91c1c"><strong>Required handwritten uploads missing:</strong> Q${missing.join(', Q')}</p>`:'<p style="color:#047857">All required handwritten uploads are complete.</p>'}<p style="margin-top:12px;color:#b91c1c"><strong>After submission you cannot change your answers.</strong></p>`;document.getElementById('submitModal').classList.add('open')}catch(e){alert(e.message)}}
function closeSubmitModal(){document.getElementById('submitModal').classList.remove('open')}async function submitTest(auto=false){try{const r=await fetch(`/api/attempt/${attemptId}/submit`,{method:'POST'}),d=await r.json();if(!r.ok){closeSubmitModal();alert(d.error||'Submission failed');return}window.location.href=d.redirect_url}catch(e){alert('Submission failed')}}
function typesetMath(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([document.getElementById('questionContent')]).catch(()=>{})}
function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}init();
</script>
{% endblock %}
